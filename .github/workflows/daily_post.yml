name: Telegram posts (4 раза в день)

on:
  schedule:
    # Строго в дневное время с 09:00 до 19:30 МСК (после 20:00 публикации запрещены)
    # 06:00 UTC = 09:00 МСК
    # 09:00 UTC = 12:00 МСК
    # 13:00 UTC = 16:00 МСК
    # 16:30 UTC = 19:30 МСК
    - cron: '0 6,9,13 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish today's article
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/workflows/publish_daily.js

name: Auto-build articles

on:
  push:
    branches: [main]
    paths:
      - 'script.js'
      - 'article_content.js'
      - 'article_images.js'
      - 'generate_articles.js'
      - 'index.html'
      - 'styles.css'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate article pages and sitemap
        run: node generate_articles.js

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles brands tags sitemap.xml
          if git diff --cached --quiet; then
            echo "Нет изменений в страницах"
          else
            git commit -m "Auto: пересобраны страницы статей, брендов, тегов и sitemap"
            git pull --rebase origin main
            git push origin main
          fi

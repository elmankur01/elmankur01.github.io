name: Generate videos

on:
  workflow_dispatch:
    inputs:
      articles:
        description: 'Номера статей через пробел или "all"'
        required: true
        default: '2'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg, font and edge-tts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core python3-pip
          sudo python3 -m pip install -q --break-system-packages edge-tts

      - name: Generate videos
        run: node tools/generate_video.js ${{ inputs.articles }}

      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: tools/videos/*.mp4
          if-no-files-found: error
          retention-days: 30
